name: emush

services:
  emush-web:
    container_name: emush-web
    ports: ["127.0.0.1:8171:80"]
    build:
      context: .
      dockerfile: Dockerfile.web
    networks:
      - emush-network
    restart: unless-stopped
    depends_on:
      emush-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
  
  emush-app:
    container_name: emush-app
    ports: ["127.0.0.1:8170:5173"]
    build:
      context: .
      dockerfile: Dockerfile.app
    networks:
      - emush-network
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      emush-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  emush-api:
    container_name: emush-api
    build:
      context: .
      dockerfile: Dockerfile.api
    networks:
      - emush-network
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - emush-database
    cap_add:
      - SYS_PTRACE
    volumes:
      - jwt-keys:/var/www/html/config/jwt
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  emush-database:
    container_name: emush-database
    build:
      context: .
      dockerfile: Dockerfile.db
    networks:
      - emush-network
    restart: unless-stopped
    environment:
      POSTGRES_USER: emush
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: emush
      POSTGRES_MULTIPLE_DATABASES: eternaltwin.prod
    volumes:
      - emush-database-data:/var/lib/postgresql/data
      - ./database-init.sh:/docker-entrypoint-initdb.d/database-initdb.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emush -d emush"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  emush-eternaltwin:
    container_name: emush-eternaltwin
    ports: ["127.0.0.1:8172:50320"]
    build:
      context: .
      dockerfile: Dockerfile.eternaltwin
      args:
        UID: ${UID:-1000}
        GID: ${UID:-1000}
    depends_on:
      - emush-database
    networks:
      - emush-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:50320/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  emush-jaeger:
    container_name: emush-jaeger
    image: jaegertracing/jaeger:2.11.0
    networks:
      - emush-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:13133/status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  emush-database-data:
    driver: local
  jwt-keys:
    driver: local

networks:
  emush-network:
    driver: bridge
