name: Deploy (cmnemoi)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Branch to deploy
        type: choice
        options: [main, legacy]
        default: main
  # Rebuild every week to pick up security fixes of the base images.
  schedule:
    - cron: "0 5 * * 1"

# Deploy one run at a time: two concurrent `docker compose up` collide while recreating containers.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Deploy eMush
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd www
            CI=true ./deploy.cmnemoi.sh --${{ inputs.channel || 'legacy' }}
